name: Xưởng âm thanh — nén và ghép tiếng cảnh

# Ba nguồn, chọn cái nào cũng được:
#   1. Issue có nhãn "xuong-am" — kéo file tiếng vào ô nội dung. KHÔNG CẦN TOKEN,
#      làm được trên điện thoại. Đây là đường chính.
#   2. xuong-am-inbox/<mã>/  — thả file vào thư mục con mang mã nhóm.
#   3. Trang Xưởng (docs/xuong-am) đẩy file vào xuong-am-inbox/<mã>/ — cần token,
#      tiện khi dùng máy tính.
#
# Push bằng GITHUB_TOKEN không kích hoạt workflow khác, nên deploy Pages được gộp
# ngay trong job "deploy" ở cuối.
on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: ["xuong-am-inbox/**"]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

concurrency:
  group: xuong-am
  cancel-in-progress: false

jobs:
  xu-ly:
    if: >-
      github.actor != 'github-actions[bot]' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push' ||
       (github.event_name == 'issues' &&
        (contains(github.event.issue.labels.*.name, 'xuong-am') ||
         contains(github.event.issue.body, 'user-attachments'))) ||
       (github.event_name == 'issue_comment' &&
        contains(github.event.comment.body, 'user-attachments')))
    runs-on: ubuntu-latest
    outputs:
      da_commit: ${{ steps.commit.outputs.da_commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài ffmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg

      - name: Thu thập nội dung Issue (nếu có)
        if: github.event_name == 'issues' || github.event_name == 'issue_comment'
        env:
          BODY: ${{ github.event.issue.body }}
          COMMENT: ${{ github.event.comment.body }}
        run: |
          printf '%s\n\n%s\n' "$BODY" "$COMMENT" > /tmp/issue-am.md
          wc -c /tmp/issue-am.md

      - name: Xử lý tiếng (Issue hoặc inbox)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ -s /tmp/issue-am.md ] && grep -qE 'https?://[^ ]*(user-attachments|githubusercontent)' /tmp/issue-am.md; then
            echo "Nguồn: file trong Issue"
            python3 tools/xu_ly_am.py --urls-file /tmp/issue-am.md --report /tmp/bao-cao-am.json || true
          else
            echo "Nguồn: thư mục xuong-am-inbox"
            python3 tools/xu_ly_am.py --inbox xuong-am-inbox --report /tmp/bao-cao-am.json || true
          fi

      - name: Ghi danh sách
        run: |
          python3 game/ghi_danh_sach_am.py
          # Xưởng ghi cứng trạng thái "đã có" vào HTML lúc sinh trang, nên có
          # tiếng mới mà không sinh lại thì thẻ vẫn báo "chưa có" và nút nghe
          # vẫn ẩn. Sinh lại ở đây để trang khớp danh sách vừa ghi.
          python3 game/tao_xuong_am.py

      - name: Dọn hộp nhận
        run: |
          # CHỈ xoá file đã xử lý xong. Xoá cả file xử lý lỗi là mất luôn bản
          # người dùng vừa gửi: tiếng không lên trang mà file cũng biến mất,
          # không còn gì để chạy lại. Lỗi thì giữ nguyên trong hộp nhận.
          python3 - <<'PY'
          import json, os
          try:
              d = json.load(open('/tmp/bao-cao-am.json'))
          except Exception:
              raise SystemExit("không đọc được báo cáo — giữ nguyên hộp nhận")
          xong = {x['ma'] for x in d.get('da_luu', [])}
          for ma in sorted(xong):
              for ten in os.listdir(os.path.join('xuong-am-inbox', ma)) if os.path.isdir(os.path.join('xuong-am-inbox', ma)) else []:
                  p = os.path.join('xuong-am-inbox', ma, ten)
                  if os.path.isfile(p):
                      os.remove(p)
          for loi in d.get('loi', []):
              print(f"::warning::giữ lại file vì xử lý lỗi: {loi}")
          print(f"đã xoá {len(xong)} thư mục đã xử lý: {', '.join(sorted(xong)) or '(không có)'}")
          PY
          find xuong-am-inbox -mindepth 1 -type d -empty -delete 2>/dev/null || true
          touch xuong-am-inbox/.gitkeep

      - name: Commit
        id: commit
        run: |
          git config user.name "xuong-am-bot"
          git config user.email "xuong-am-bot@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            SO=$(python3 -c "import json;print(len(json.load(open('/tmp/bao-cao-am.json')).get('da_luu',[])))" 2>/dev/null || echo "?")
            git commit -q -m "Xưởng âm thanh: ghép ${SO} tiếng cảnh"
            # Người dùng và agent cũng push vào main. Đẩy thẳng thì bị từ chối
            # ("fetch first") và file kẹt lại trong hộp nhận — đã xảy ra một lần
            # với cong_dong_doi_mat. Thử lại vài lượt, mỗi lượt rebase lên main
            # mới nhất. `git add -A` ở trên đã stage sẵn nên rebase giữ nguyên.
            for lan in 1 2 3 4 5; do
              if git push; then
                echo "da_commit=1" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "Push bị từ chối (lượt $lan) — rebase lên main rồi thử lại."
              git pull --rebase --autostash origin main || true
              sleep $((lan * 5))
            done
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "::error::Không push được sau 5 lượt — tiếng vẫn nằm trong hộp nhận."
              exit 1
            fi
          fi

      - name: Báo lại trong Issue
        if: >-
          (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
          steps.commit.outputs.da_commit == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          SO_ISSUE: ${{ github.event.issue.number }}
        run: |
          python3 - <<'PY' > /tmp/comment-am.md
          import json
          d = json.load(open('/tmp/bao-cao-am.json'))
          ra = ["## ✅ Đã nhận tiếng", ""]
          if d.get("da_luu"):
              for x in d["da_luu"]:
                  ra.append(f"- `{x['ma']}` → `{x['file']}`")
          if d.get("chua_ro"):
              ra += ["", "## ⚠️ Chưa rõ nhóm tiếng", ""]
              for x in d["chua_ro"]:
                  ra.append(f"- {x['url']} — {x['ly_do']}")
              ra += ["", "Đổi tên file cho có mã nhóm rồi gửi lại, "
                         "hoặc viết mã nhóm ở dòng ngay trên link."]
          if d.get("loi"):
              ra += ["", "## ❌ Lỗi", ""]
              for x in d["loi"]:
                  ra.append(f"- {x}")
          ra += ["", "_Do AI tạo (OpenHands) nhân danh chủ repo._"]
          print("\n".join(ra))
          PY
          gh issue comment "$SO_ISSUE" --body-file /tmp/comment-am.md

  deploy:
    needs: xu-ly
    # Có tiếng mới thì deploy. Chạy tay (workflow_dispatch) cũng deploy, để khi
    # deploy hỏng tạm thời thì chạy lại workflow là đưa được bản đã commit lên
    # trang — hộp nhận lúc đó rỗng nên không có da_commit, trước đây deploy bị
    # bỏ qua và chạy lại workflow không có tác dụng gì.
    # `always()` để chạy được cả khi job xu-ly bị bỏ qua (Issue không có nhãn,
    # comment không có file): mặc định `needs` bị bỏ qua là job này bỏ qua luôn,
    # nên chạy tay để deploy lại sẽ không làm gì cả.
    if: >-
      always() &&
      (needs.xu-ly.outputs.da_commit == '1' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment2.outputs.page_url || steps.deployment3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      # deploy-pages hỏng tạm thời khá thường: "Fetching artifact metadata
      # failed" / "No artifacts named github-pages were found" — lỗi phía
      # GitHub, không phải file sai. Đã chết 2 lần liền (run 45203424457,
      # 45204652597) làm tiếng mới không lên trang. Thử lại vài lượt.
      - id: deployment
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Chờ GitHub ổn lại
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Thử lại deploy nếu lỗi tạm thời
        if: steps.deployment.outcome == 'failure'
        id: deployment2
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Chờ thêm
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        run: sleep 60
      - name: Thử lại deploy lần cuối
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure'
        id: deployment3
        uses: actions/deploy-pages@v4
        continue-on-error: true
      - name: Báo lỗi nếu vẫn không deploy được
        if: steps.deployment.outcome == 'failure' && steps.deployment2.outcome == 'failure' && steps.deployment3.outcome == 'failure'
        run: |
          echo "::error::Deploy Pages hỏng 3 lượt. Chạy lại workflow này, hoặc chạy Triển khai GitHub Pages."
          exit 1
